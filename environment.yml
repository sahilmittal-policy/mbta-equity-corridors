name: eng-corridors
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.24
  - matplotlib>=3.7
  # Spatial stack: only needed for scripts/01. Conda handles the GDAL
  # dependency far more reliably than pip.
  - geopandas>=0.14
  - shapely>=2.0
  - pyogrio>=0.7
  - jupyter
  - pytest>=7.4
  - pip
  - pip:
      - -e .
