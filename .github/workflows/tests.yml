name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Test
        run: pytest

      # The figures are committed, so this catches the case where someone
      # changes the data or the plotting code and forgets to regenerate.
      - name: Figures still build
        run: python scripts/make_figures.py --outdir /tmp/figures
